<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>开箱 · 认识机身 · 开机准备 · 课程讲义</title>
<meta name="description" content="富士 X-S20 机身操作课程单课页原型：复古排印风格的课时详情与操作步骤。" />
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }
  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */

/* ---------- tokens ---------- */
:root {
  --ink: #111111;
  --ink-soft: #2b2b2b;
  --muted: #6f6f6f;
  --faint: #9c9c9c;
  --paper: #f5f5f4;
  --paper-2: #ececea;
  --panel: #e6e6e4;
  --line: #cfcfcc;
  --line-strong: #111111;

  --font-serif: "EB Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
    "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", "Noto Serif SC", "Songti TC", SimSun, serif;

  --fs-lead: clamp(15px, 1.15vw, 17px);
  --fs-body: 16px;
  --fs-sm: 13.5px;
  --fs-xs: 11.5px;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
  --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px; --s9: 96px;

  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --gutter: clamp(20px, 4vw, 56px);
  --maxw: 1120px;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: var(--fs-body);
  line-height: 1.45;
  font-kerning: normal;
  font-variant-numeric: oldstyle-nums proportional-nums;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, p, dl, dd, ol, ul, figure { margin: 0; }
ol, ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
svg { display: block; }

.skip {
  position: absolute; left: 12px; top: -60px; z-index: 20;
  padding: 10px 16px; background: var(--ink); color: var(--paper);
  text-decoration: none; font-size: var(--fs-sm);
  transition: top 160ms var(--ease);
}
.skip:focus-visible { top: 12px; }

:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ---------- masthead ---------- */
.masthead { border-top: 4px solid var(--line-strong); }

.masthead-inner {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: clamp(20px, 3vw, 34px) var(--gutter) clamp(6px, 0.8vw, 10px);
}

/* ---------- lesson ---------- */
.lesson {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 var(--gutter) var(--s8);
}

.lesson-kicker {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--s2) var(--s3);
  font-size: var(--fs-xs);
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--muted);
}
.lesson-kicker .chapter {
  font-size: 12.5px;
  letter-spacing: 0.18em;
  color: var(--ink);
}
.lesson-kicker .sep { color: var(--faint); }
.lesson-kicker .en { letter-spacing: 0.2em; color: var(--faint); }

.lesson-title {
  margin-top: var(--s3);
  font-size: clamp(30px, 4.2vw, 50px);
  font-weight: 700;
  line-height: 1.12;
  letter-spacing: 0.01em;
  text-wrap: balance;
}

.lesson-summary {
  margin-top: var(--s2);
  max-width: 60ch;
  font-size: var(--fs-lead);
  line-height: 1.42;
  color: var(--ink-soft);
}

.lesson-meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2) var(--s6);
  margin-top: var(--s4);
}
.lesson-meta > div { display: grid; gap: 1px; }
.lesson-meta dt {
  font-size: var(--fs-xs);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}
.lesson-meta dd { font-size: 15px; line-height: 1.35; }

.lesson-body { margin-top: var(--s4); }

/* ---------- section heads ---------- */
.sec { margin-bottom: var(--s6); }
.sec:last-child { margin-bottom: 0; }

.sec-head {
  display: flex;
  align-items: baseline;
  gap: var(--s3);
  padding-bottom: var(--s2);
  border-bottom: 1px solid var(--line-strong);
  font-size: 15.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.sec-head .mark {
  font-size: var(--fs-xs);
  letter-spacing: 0.2em;
  color: var(--muted);
  text-transform: uppercase;
}

.sec-head .note {
  margin-left: auto;
  font-size: var(--fs-xs);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ---------- objectives ---------- */
.objectives { --od-gap: 0px; margin-top: var(--s3); }

.objective {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr);
  gap: var(--s2);
  padding: 4px 0;
}

.objective .idx {
  font-size: 17px;
  color: var(--faint);
  line-height: 1.4;
}

.objective .txt { font-size: 15px; line-height: 1.42; }

.gear {
  --od-gap: 6px;
  margin-top: var(--s3);
  --od-rail-pad: 0px;
  flex-wrap: wrap;
  overflow: visible;
}
.gear .tag {
  padding: 4px 10px;
  font-size: var(--fs-sm);
  color: var(--ink-soft);
  background: var(--paper-2);
}

/* ---------- diagram ---------- */
.figure { margin-top: var(--s3); max-inline-size: 860px; }

.diagram-frame {
  background: var(--paper-2);
  padding: clamp(16px, 2vw, 28px);
}

.diagram { width: 100%; height: auto; color: var(--ink); }

.diagram .outline-shape { fill: none; stroke: currentColor; stroke-width: 2; }
.diagram .hairline { fill: none; stroke: currentColor; stroke-width: 1; }
.diagram .solid { fill: currentColor; stroke: none; }
.diagram .leader { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 2 3; }
.diagram .callout { fill: var(--paper-2); stroke: currentColor; stroke-width: 1.5; }
.diagram .cnum {
  fill: currentColor;
  font-family: var(--font-serif);
  font-size: 15px;
  text-anchor: middle;
  dominant-baseline: central;
}
.diagram .halo {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.4;
  stroke-dasharray: 3 4;
  opacity: 0;
  transition: opacity 200ms var(--ease);
}
.diagram .halo.is-on { opacity: 1; }

.figcap {
  margin-top: var(--s2);
  font-size: var(--fs-sm);
  line-height: 1.4;
  color: var(--muted);
  max-width: 68ch;
}
.figcap b { font-weight: 400; color: var(--ink); letter-spacing: 0.08em; }

.parts {
  --od-gap: 0px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  margin-top: var(--s4);
  max-inline-size: 860px;
}

.part {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr);
  gap: var(--s2);
  align-items: start;
  padding: 8px 10px 8px 0;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: pointer;
  transition: background-color 160ms var(--ease);
}
.part:nth-child(even) { padding-left: 12px; }
.part .pnum {
  font-size: 13px;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 50%;
  inline-size: 22px;
  block-size: 22px;
  display: grid;
  place-items: center;
  line-height: 1;
  transition: background-color 160ms var(--ease), color 160ms var(--ease), border-color 160ms var(--ease);
}
.part .pname { display: block; font-size: 14.5px; line-height: 1.4; }
.part .pdesc { display: block; font-size: var(--fs-sm); line-height: 1.4; color: var(--muted); margin-top: 2px; }

@media (hover: hover) {
  .part:not([aria-pressed="true"]):hover { background: var(--panel); }
}

.part[aria-pressed="true"] .pnum { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.part[aria-pressed="true"] .pname { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

/* ---------- steps ---------- */
.steps { margin-top: var(--s4); }

.step {
  padding: 0;
}

.step-main {
  display: grid;
  grid-template-columns: 22px 42px minmax(0, 1fr);
  gap: var(--s3);
  align-items: start;
  padding: 8px 0 8px 2px;
  cursor: pointer;
}

.step-input {
  position: absolute;
  inline-size: 1px;
  block-size: 1px;
  opacity: 0;
  pointer-events: none;
  margin: 0;
}

.step-box {
  inline-size: 20px;
  block-size: 20px;
  margin-top: 3px;
  border: 1px solid var(--ink);
  background: transparent;
  display: grid;
  place-items: center;
  transition: background-color 160ms var(--ease);
}
.step-box::after {
  content: "";
  display: block;
  inline-size: 9px;
  block-size: 5px;
  border-left: 1.6px solid var(--paper);
  border-bottom: 1.6px solid var(--paper);
  transform: rotate(-45deg) translate(1px, -1px);
  opacity: 0;
  transition: opacity 140ms var(--ease);
}
.step.is-done .step-box { background: var(--ink); }
.step.is-done .step-box::after { opacity: 1; }
.step-input:focus-visible + .step-box { outline: 2px solid var(--ink); outline-offset: 3px; }

.step-num {
  font-size: 20px;
  line-height: 1.2;
  color: var(--faint);
  letter-spacing: 0.04em;
  transition: color 160ms var(--ease);
}

.step-title {
  display: block;
  font-size: 17px;
  line-height: 1.3;
}
.step-text {
  display: block;
  margin-top: 2px;
  font-size: 15px;
  line-height: 1.45;
  color: var(--ink-soft);
  max-width: 86ch;
}

.step.is-done .step-title { color: var(--muted); }
.step.is-done .step-num { color: var(--muted); }
.step.is-done .step-text { color: var(--muted); }

@media (hover: hover) {
  .step-main:hover .step-title { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
}

/* ---------- steps progress ---------- */
.steps-progress {
  margin-top: var(--s4);
  padding-top: var(--s2);
}

.progress-count {
  display: flex;
  align-items: baseline;
  gap: var(--s4);
  font-size: 15px;
}
.progress-hint {
  font-size: var(--fs-xs);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}
.progress-count .val { letter-spacing: 0.04em; }

.progress-track {
  margin-top: var(--s3);
  max-inline-size: 420px;
  block-size: 3px;
  background: var(--line);
  overflow: hidden;
}
.progress-fill {
  display: block;
  block-size: 100%;
  background: var(--ink);
  transform-origin: left center;
  transform: scaleX(var(--p, 0));
  transition: transform 260ms var(--ease);
}

.steps-done {
  margin-top: var(--s2);
  font-size: var(--fs-sm);
  line-height: 1.45;
  color: var(--muted);
}

/* ---------- pager ---------- */
.pager {
  margin-top: var(--s6);
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--s7);
}

.pager-btn {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr);
  gap: var(--s3);
  align-items: start;
  padding: var(--s3) 0;
  background: transparent;
  border: 0;
  text-align: left;
  cursor: pointer;
  transition: opacity 160ms var(--ease);
}
.pager-btn + .pager-btn {
  padding-left: var(--s4);
  grid-template-columns: minmax(0, 1fr) 20px;
  justify-items: end;
  text-align: right;
}
.pager-btn .od-icon { --od-icon-size: 18px; margin-top: 3px; color: var(--muted); }
.pager-label {
  display: block;
  font-size: var(--fs-xs);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}
.pager-title {
  display: block;
  margin-top: 2px;
  font-size: 16px;
  line-height: 1.44;
  text-wrap: balance;
}
.pager-btn:disabled { cursor: default; opacity: 0.4; }
@media (hover: hover) {
  .pager-btn:not(:disabled):hover .pager-title { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
}

/* ---------- footer ---------- */
.page-foot {
  background: var(--paper-2);
}
.page-foot-inner {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: var(--s4) var(--gutter) var(--s5);
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2) var(--s6);
  justify-content: space-between;
  font-size: var(--fs-sm);
  color: var(--muted);
}
.page-foot-inner .mono { letter-spacing: 0.14em; text-transform: uppercase; font-size: var(--fs-xs); }

/* ---------- responsive ---------- */
@media (max-width: 1023px) {
  .lesson-title { font-size: clamp(25px, 4.6vw, 33px); }
}

@media (max-width: 720px) {
  :root { --fs-body: 15.5px; }
  .parts { grid-template-columns: minmax(0, 1fr); }
  .part:nth-child(even) { padding-left: 0; }
  .step-main { grid-template-columns: 20px minmax(0, 1fr); gap: var(--s2) var(--s3); padding: 10px 0; }
  .step-num { grid-column: 2; font-size: 14px; letter-spacing: 0.16em; color: var(--muted); }
  .step-body { grid-column: 2; }
  .step-title { font-size: 16.5px; }
  .pager { grid-template-columns: minmax(0, 1fr); gap: var(--s4); }
  .pager-btn + .pager-btn {
    padding-left: 0;
    grid-template-columns: 20px minmax(0, 1fr);
    justify-items: start;
    text-align: left;
  }
  .pager-btn + .pager-btn .od-icon { order: -1; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 1ms !important;
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

              <line x1="588" y1="308" x2="546" y2="278" />

            <g class="halo" data-halo="1"><circle cx="205" cy="94" r="34" /></g>

  var objectiveList = document.getElementById("objective-list");

  function setText(id, value) {
    var node = document.getElementById(id);
    if (node) node.textContent = value;
  }

  function el(tag, props, children) {
    var node = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (key) {
        if (key === "class") node.className = props[key];
        else if (key === "text") node.textContent = props[key];
        else node.setAttribute(key, props[key]);
      });
    }
    (children || []).forEach(function (child) {
      if (child) node.appendChild(child);
    });
    return node;
  }

  function buildObjectives(lesson) {
    var items = lesson.objectives.map(function (text, index) {
      return el("li", { class: "objective" }, [
        el("span", { class: "idx", text: String(index + 1).padStart(2, "0") }),
        el("span", { class: "txt", text: text })
      ]);
    });
    objectiveList.replaceChildren.apply(objectiveList, items);
  }

  function buildGear(lesson) {
    var items = lesson.gear.map(function (name) {
      return el("li", { class: "tag", text: name });
    });
    gearList.replaceChildren.apply(gearList, items);
  }

  function buildSteps(lessonIndex) {
    var lesson = LESSONS[lessonIndex];
    var done = stepState[lessonIndex];
    var items = lesson.steps.map(function (step, index) {
      var input = el("input", {
        type: "checkbox",
        class: "step-input",
        id: "step-" + lessonIndex + "-" + index,
        "data-step": String(index)
      });
      input.checked = !!done[index];

      var body = el("span", { class: "step-body" }, [
        el("span", { class: "step-title", text: step.t }),
        el("span", { class: "step-text", text: step.d })
      ]);

      var label = el("label", { class: "step-main", for: "step-" + lessonIndex + "-" + index }, [
        input,
        el("span", { class: "step-box", "aria-hidden": "true" }),
        el("span", { class: "step-num", text: String(index + 1).padStart(2, "0") }),
        body
      ]);

      var item = el("li", { class: "step" }, [label]);
      if (done[index]) item.classList.add("is-done");
      return item;
    });
    stepList.replaceChildren.apply(stepList, items);
  }

  function resetParts() {
    Array.prototype.forEach.call(parts.querySelectorAll("button[data-part]"), function (button) {
      button.setAttribute("aria-pressed", "false");
    });
    halos.forEach(function (halo) { halo.classList.remove("is-on"); });
  }

  function chapterOf(index) {
    if (index <= 1) return "第一章 · 机身与曝光";
    if (index <= 4) return "第二章 · 焦点与色彩";
    return "第三章 · 视频与维护";
  }

  function updateProgress() {
    var done = stepState[current];
    var total = done.length;
    var count = done.filter(Boolean).length;
    setText("progress-count", count + " / " + total + " 步");
    progressFill.style.setProperty("--p", total ? String(count / total) : "0");
    stepsDone.hidden = !(total > 0 && count === total);
  }

  function renderLesson(index, shouldScroll) {
    current = index;
    var lesson = LESSONS[index];

    setText("lesson-chapter", chapterOf(index));
    setText("lesson-kicker", lesson.n);
    setText("lesson-en", lesson.en);
    setText("lesson-title", lesson.title);
    document.title = lesson.title + " · 课程讲义";
    setText("lesson-summary", lesson.summary);
    setText("meta-duration", lesson.minutes + " 分钟");
    setText("meta-level", lesson.level);
    setText("meta-gear", lesson.gear.join(" · "));
    setText("exercise-text", lesson.exercise);

    buildObjectives(lesson);
    buildGear(lesson);
    buildSteps(index);
    resetParts();
    updateProgress();

    var hasPrev = index > 0;
    var hasNext = index < LESSONS.length - 1;
    prevBtn.disabled = !hasPrev;
    nextBtn.disabled = !hasNext;
    setText("prev-title", hasPrev ? LESSONS[index - 1].title : "已是第一课");
    setText("next-title", hasNext ? LESSONS[index + 1].title : "已是最后一课");

    if (shouldScroll) {
      var behavior = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
      document.getElementById("main").scrollIntoView({ behavior: behavior, block: "start" });
    }
  }

  stepList.addEventListener("change", function (event) {
    var input = event.target.closest("input[data-step]");
    if (!input) return;
    var index = Number(input.dataset.step);
    if (!stepState[current] || index >= stepState[current].length) return;
    stepState[current][index] = input.checked;
    var item = input.closest(".step");
    if (item) item.classList.toggle("is-done", input.checked);
    updateProgress();
  });

  parts.addEventListener("click", function (event) {
    var button = event.target.closest("button[data-part]");
    if (!button) return;
    var part = button.dataset.part;
    var turningOn = button.getAttribute("aria-pressed") !== "true";

    Array.prototype.forEach.call(parts.querySelectorAll("button[data-part]"), function (other) {
      other.setAttribute("aria-pressed", "false");
    });
    halos.forEach(function (halo) { halo.classList.remove("is-on"); });

    if (turningOn) {
      button.setAttribute("aria-pressed", "true");
      halos.forEach(function (halo) {
        if (halo.dataset.halo === part) halo.classList.add("is-on");
      });
    }
  });

  prevBtn.addEventListener("click", function () {
    if (current > 0) renderLesson(current - 1, true);
  });

  nextBtn.addEventListener("click", function () {
    if (current < LESSONS.length - 1) renderLesson(current + 1, true);
  });

  renderLesson(0, false);
})();
</script>
</body>
</html>
