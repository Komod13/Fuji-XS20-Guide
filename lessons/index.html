<style>
:root {
  --ink: #111111;
  --ink-soft: #2b2b2b;
  --muted: #6f6f6f;
  --faint: #9c9c9c;
  --paper: #f5f5f4;
  --panel: #e9e9e7;

  --font-serif: "EB Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
    "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", "Noto Serif SC", "Songti TC", SimSun, serif;

  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --gutter: clamp(24px, 5vw, 64px);
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 16px;
  line-height: 1.5;
  font-kerning: normal;
  font-variant-numeric: oldstyle-nums proportional-nums;
  -webkit-font-smoothing: antialiased;
  border-top: 4px solid var(--ink);
}

h1, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }

:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

/* ---------- cover ---------- */
.cover {
  flex: 1 1 auto;
  display: grid;
  place-items: center;
  padding: clamp(40px, 8vh, 88px) var(--gutter);
}

.cover-inner {
  width: 100%;
  max-width: 620px;
  text-align: center;
}

.eyebrow {
  font-size: 11px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: clamp(18px, 3vh, 28px);
  animation: rise 260ms var(--ease) both;
}

/* ---------- title ---------- */
.title {
  font-weight: 700;
  animation: rise 300ms var(--ease) 60ms both;
}

.title-latin {
  display: block;
  font-size: clamp(20px, 2.3vw, 28px);
  font-weight: 400;
  letter-spacing: 0.38em;
  padding-left: 0.38em;
  line-height: 1;
  margin-bottom: clamp(10px, 1.4vh, 16px);
}

.title-cn {
  display: block;
  font-size: clamp(36px, 5.2vw, 64px);
  line-height: 1.06;
  letter-spacing: 0.02em;
}

/* ---------- contents ---------- */
.toc {
  margin: clamp(32px, 5.5vh, 56px) auto 0;
  width: 100%;
  max-width: 560px;
  text-align: left;
  animation: rise 300ms var(--ease) 140ms both;
}

.toc a {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) 16px;
  align-items: baseline;
  gap: 12px;
  padding: 9px 10px;
  color: inherit;
  text-decoration: none;
  transition: background-color 180ms var(--ease);
}

.toc .no {
  font-size: 12px;
  letter-spacing: 0.1em;
  color: var(--muted);
}

.toc .name {
  font-size: 17px;
  line-height: 1.4;
  text-wrap: pretty;
}

.toc .arrow {
  align-self: center;
  width: 14px;
  height: 1px;
  background: currentColor;
  position: relative;
  opacity: 0;
  transition: opacity 180ms var(--ease), transform 180ms var(--ease);
}
.toc .arrow::after {
  content: "";
  position: absolute;
  right: 0;
  top: -3px;
  width: 6px;
  height: 6px;
  border-top: 1px solid currentColor;
  border-right: 1px solid currentColor;
  transform: rotate(45deg);
}

@media (hover: hover) {
  .toc a:hover { background: var(--panel); }
  .toc a:hover .name { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
  .toc a:hover .arrow { opacity: 1; transform: translateX(2px); }
}

.toc a:focus-visible { outline-offset: -2px; }

/* ---------- foot ---------- */
.foot {
  padding: 0 var(--gutter) clamp(18px, 3.4vh, 30px);
  display: flex;
  justify-content: center;
}

.foot-line {
  font-size: 10.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--faint);
  text-align: center;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 520px) {
  .toc a { grid-template-columns: 28px minmax(0, 1fr) 14px; gap: 10px; padding: 9px 4px; }
  .toc .name { font-size: 15.5px; }
  .title-cn { font-size: clamp(30px, 9vw, 40px); }
  .title-latin { letter-spacing: 0.3em; padding-left: 0.3em; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-delay: 0ms !important;
    transition-duration: 1ms !important;
  }
}
</style>
