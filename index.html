<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-S20 完全操作课程</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="lessons/index.html">
<link rel="stylesheet" href="assets/course.css">
<style>
  .entry {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: clamp(32px, 10vh, 96px) var(--gutter);
    text-align: center;
  }
  .entry-inner { width: 100%; max-width: 560px; }
  .entry-eyebrow {
    font-size: var(--fs-xs);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: var(--s4);
  }
  .entry-title {
    font-size: clamp(28px, 4.4vw, 46px);
    font-weight: 700;
    line-height: 1.14;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  .entry-lede {
    margin-top: var(--s3);
    font-size: var(--fs-lead);
    line-height: 1.5;
    color: var(--ink-soft);
  }
  .entry-link {
    display: inline-flex;
    align-items: center;
    gap: 0.6em;
    margin-top: var(--s5);
    padding: 10px 18px 10px 14px;
    border: 1px solid var(--ink);
    color: var(--ink);
    font-size: var(--fs-xs);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-decoration: none;
    transition: color 160ms var(--ease), background-color 160ms var(--ease);
  }
  .entry-link .od-icon { --od-icon-size: 12px; }
  .entry-foot {
    margin-top: var(--s6);
    font-size: var(--fs-xs);
    letter-spacing: 0.12em;
    color: var(--faint);
  }
  @media (hover: hover) {
    .entry-link:hover { background: var(--ink); color: var(--paper); }
  }
  .entry-link:active { background: var(--ink); color: var(--paper); }
</style>
<meta http-equiv="refresh" content="0; url=lessons/index.html">
</head>
<body>
<main class="entry">
  <div class="entry-inner">
    <p class="entry-eyebrow">FUJIFILM X-S20 · Operation Course</p>
    <h1 class="entry-title">X-S20 完全操作课程</h1>
    <p class="entry-lede">9 课，从开箱到故障排除。</p>
    <a class="entry-link" href="lessons/index.html">
      <svg class="od-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M9 5 L16 12 L9 19" fill="none" stroke="currentColor" stroke-width="1.5" />
      </svg>
      <span>进入课程</span>
    </a>
    <p class="entry-foot">正在跳转…若未自动跳转，请点上方按钮。</p>
  </div>
</main>
</body>
</html>
