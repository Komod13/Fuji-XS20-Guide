name: Deploy to GitHub Pages

# 只发布授课站点需要的文件（lessons/ + assets/），
# 大纲、教学笔记、learning-records、prototype、reference 不会上线。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 组装站点目录
        run: |
          mkdir -p _site
          cp -r lessons assets _site/
          cp index.html robots.txt _site/
          touch _site/.nojekyll

      - name: 配置 Pages（首次运行自动启用）
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
